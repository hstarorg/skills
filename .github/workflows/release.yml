name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Package skills
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          shopt -s nullglob

          if ! compgen -G 'skills/*/' > /dev/null; then
            echo "No skills are available to release." >&2
            exit 1
          fi

          for skill_dir in skills/*/; do
            skill_name="$(basename "${skill_dir}")"
            tar -czf "dist/${skill_name}.tar.gz" -C skills "${skill_name}"
          done

          sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
