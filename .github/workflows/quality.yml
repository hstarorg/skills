name: Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate repository and skills
        shell: bash
        run: |
          set -euo pipefail

          test -f README.md
          test -f AGENTS.md
          test -f LICENSE

          shopt -s nullglob
          for skill_dir in skills/*/; do
            skill_name="$(basename "${skill_dir}")"
            skill_file="${skill_dir}SKILL.md"

            if [[ ! "${skill_name}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || (( ${#skill_name} > 64 )); then
              echo "Invalid skill directory name: ${skill_name}" >&2
              exit 1
            fi

            if [[ ! -f "${skill_file}" ]]; then
              echo "Missing ${skill_file}" >&2
              exit 1
            fi

            declared_name="$(sed -n 's/^name:[[:space:]]*//p' "${skill_file}" | head -n 1)"
            description="$(sed -n 's/^description:[[:space:]]*//p' "${skill_file}" | head -n 1)"

            if [[ "${declared_name}" != "${skill_name}" ]]; then
              echo "Skill name mismatch in ${skill_file}" >&2
              exit 1
            fi

            if [[ -z "${description}" ]]; then
              echo "Missing description in ${skill_file}" >&2
              exit 1
            fi
          done
